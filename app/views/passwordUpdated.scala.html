@()

@main("Password updated | Makao Hub") {

  <section class="auth">
    <div class="auth-media">
      <img src="@routes.Assets.versioned("images/photo2.jpg")" alt="A sunny bedroom with a desk by the window">
    </div>

    <div class="auth-panel">
      <div class="auth-box">
        <h1>Password updated</h1>
        <p class="lead">Your password has been changed. Sign in with your new password.</p>
        <a class="btn block" href="/get-started?mode=login">Sign in</a>
      </div>
    </div>
  </section>

}
